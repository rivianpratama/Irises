name: Deploy to Compute Engine VM

# Every push to `main` builds the Docker image, pushes it to Artifact Registry,
# ships docker-compose.yml + Caddyfile to the VM, and restarts the container —
# all over an IAP SSH tunnel (no public SSH port). You can also deploy by hand
# from the Actions tab (workflow_dispatch).
#
# One-time setup (project, service accounts, VM, firewall, GitHub secret/vars)
# is in DEPLOY.md / deploy/gcp-setup.sh.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false   # never interrupt a deploy mid-restart

env:
  REPO: irises        # Artifact Registry repo
  IMAGE_NAME: irises  # image name within the repo

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}   # deploy-SA key; no GitHub↔GCP binding

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Configure Docker auth for Artifact Registry
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Build & push image
        run: |
          IMAGE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${REPO}/${IMAGE_NAME}"
          docker build -t "$IMAGE:$GITHUB_SHA" -t "$IMAGE:latest" .
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"

      - name: Ship compose files to the VM (IAP SSH)
        run: |
          gcloud compute scp --tunnel-through-iap --zone "${{ vars.GCP_ZONE }}" --quiet \
            deploy/docker-compose.yml deploy/Caddyfile deploy/app.env \
            "${{ vars.GCP_VM_NAME }}:/tmp/"

      - name: Pull latest image + restart on the VM (IAP SSH)
        run: |
          gcloud compute ssh --tunnel-through-iap --zone "${{ vars.GCP_ZONE }}" --quiet \
            "${{ vars.GCP_VM_NAME }}" --command '
              command -v docker >/dev/null 2>&1 || { echo "FATAL: Docker not installed — run gcp-setup.sh (it bootstraps the VM)."; exit 1; } &&
              test -f /opt/irises/.env || { echo "FATAL: /opt/irises/.env not found — run gcp-setup.sh and add your API keys first (DEPLOY.md)."; exit 1; } &&
              test -f /tmp/app.env || { echo "FATAL: app.env was not shipped — did you commit it? Run: git add deploy/app.env"; exit 1; } &&
              sudo install -d -m 0755 /opt/irises &&
              sudo install -m 0644 /tmp/docker-compose.yml /tmp/Caddyfile /tmp/app.env /opt/irises/ &&
              cd /opt/irises &&
              sudo docker compose pull &&
              ( sudo docker compose up -d --wait --wait-timeout 120 || { echo "App did not become healthy:"; sudo docker compose logs --tail=50 app; exit 1; } ) &&
              sudo docker image prune -f --filter "until=72h"'
