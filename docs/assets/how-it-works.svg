<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif">
  <title id="t">How a text becomes an answer</title>
  <desc id="d">You text Irises. Irises replies at once, writes a meta-prompt for hermes, and re-voices the engine's answer in the same chat.</desc>
  <defs>
    <marker id="aYou" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="aIris" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d5bd0"/>
    </marker>
    <marker id="aHerm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>

  <!-- card -->
  <rect x="0.75" y="0.75" width="1198.5" height="658.5" rx="24" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>

  <!-- title -->
  <text x="40" y="54" font-family="Didot, 'Bodoni MT', 'Playfair Display', Georgia, 'Times New Roman', serif" font-size="30" fill="#111827">How a text becomes an answer</text>
  <text x="40" y="80" font-size="14" fill="#6b7280">Irises is the voice. hermes is the reach. One function connects them, and nothing else crosses.</text>

  <!-- ─────────── column A · you ─────────── -->
  <text x="60" y="122" font-size="12" font-weight="700" letter-spacing="2.2" fill="#374151">YOU</text>
  <text x="60" y="140" font-size="12.5" fill="#6b7280">any channel your engine already speaks</text>

  <!-- phone, iMessage style -->
  <rect x="60" y="154" width="220" height="392" rx="34" fill="#ffffff" stroke="#111827" stroke-width="3"/>
  <rect x="138" y="166" width="64" height="16" rx="8" fill="#111827"/>

  <!-- contact header -->
  <circle cx="170" cy="204" r="13" fill="#e5e7eb"/>
  <text x="170" y="209" text-anchor="middle" font-size="12" font-weight="700" fill="#374151">I</text>
  <text x="170" y="232" text-anchor="middle" font-size="11.5" fill="#111827">Irises</text>
  <line x1="62" y1="240" x2="278" y2="240" stroke="#e5e7eb" stroke-width="1"/>

  <!-- sent bubble, blue, right -->
  <rect x="102" y="254" width="164" height="48" rx="16" fill="#0a84ff"/>
  <text x="116" y="274" font-size="13" fill="#ffffff">did the electric bill</text>
  <text x="116" y="292" font-size="13" fill="#ffffff">come in yet</text>
  <text x="264" y="316" text-anchor="end" font-size="10" fill="#8e8e93">Delivered</text>

  <!-- received, grey, left -->
  <rect x="74" y="328" width="76" height="30" rx="15" fill="#e9e9eb"/>
  <text x="88" y="348" font-size="13" fill="#111827">one sec</text>

  <rect x="74" y="370" width="188" height="48" rx="16" fill="#e9e9eb"/>
  <text x="88" y="390" font-size="13" fill="#111827">yep, came in on the 16th</text>
  <text x="88" y="408" font-size="13" fill="#111827">84.50, due by the 30th</text>

  <!-- input bar -->
  <rect x="74" y="500" width="192" height="30" rx="15" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="90" y="520" font-size="12" fill="#8e8e93">iMessage</text>

  <text x="170" y="572" text-anchor="middle" font-size="12" fill="#6b7280">Telegram · WhatsApp · Signal · Discord · web</text>

  <!-- ─────────── column B · irises ─────────── -->
  <text x="380" y="122" font-size="12" font-weight="700" letter-spacing="2.2" fill="#6d5bd0">IRISES · THE VOICE</text>
  <text x="380" y="140" font-size="12.5" fill="#6b7280">persona, memory, pacing. The only part that writes to you.</text>

  <rect x="380" y="154" width="420" height="392" rx="20" fill="#f7f7f9" stroke="#e5e7eb" stroke-width="1.2"/>

  <rect x="400" y="174" width="184" height="60" rx="12" fill="#ffffff" stroke="#e2e4e8" stroke-width="1"/>
  <text x="416" y="199" font-size="15" font-weight="700" fill="#111827">Convo</text>
  <text x="416" y="218" font-size="12" fill="#6b7280">front line · answers now</text>

  <rect x="596" y="174" width="184" height="60" rx="12" fill="#ffffff" stroke="#e2e4e8" stroke-width="1"/>
  <text x="612" y="199" font-size="15" font-weight="700" fill="#111827">Composer</text>
  <text x="612" y="218" font-size="12" fill="#6b7280">re-voices the result</text>

  <rect x="400" y="244" width="184" height="60" rx="12" fill="#ffffff" stroke="#e2e4e8" stroke-width="1"/>
  <text x="416" y="269" font-size="15" font-weight="700" fill="#111827">Fallfirm</text>
  <text x="416" y="288" font-size="12" fill="#6b7280">holds · recovers</text>

  <rect x="596" y="244" width="184" height="60" rx="12" fill="#ffffff" stroke="#e2e4e8" stroke-width="1"/>
  <text x="612" y="269" font-size="15" font-weight="700" fill="#111827">Classify</text>
  <text x="612" y="288" font-size="12" fill="#6b7280">decides · never speaks</text>

  <!-- shared persona bar -->
  <rect x="400" y="318" width="380" height="28" rx="8" fill="#efeaff" stroke="#6d5bd0" stroke-width="1"/>
  <text x="590" y="337" text-anchor="middle" font-size="12" fill="#4c3d99">one personality text, shared by all four</text>

  <!-- memory -->
  <text x="400" y="374" font-size="11" font-weight="700" letter-spacing="1.8" fill="#9ca3af">MEMORY</text>
  <rect x="400" y="384" width="60" height="26" rx="13" fill="#ffffff" stroke="#e2e4e8" stroke-width="1"/><text x="430" y="402" text-anchor="middle" font-size="12" fill="#374151">short</text>
  <rect x="468" y="384" width="74" height="26" rx="13" fill="#ffffff" stroke="#e2e4e8" stroke-width="1"/><text x="505" y="402" text-anchor="middle" font-size="12" fill="#374151">medium</text>
  <rect x="550" y="384" width="54" height="26" rx="13" fill="#ffffff" stroke="#e2e4e8" stroke-width="1"/><text x="577" y="402" text-anchor="middle" font-size="12" fill="#374151">long</text>
  <rect x="612" y="384" width="66" height="26" rx="13" fill="#ffffff" stroke="#e2e4e8" stroke-width="1"/><text x="645" y="402" text-anchor="middle" font-size="12" fill="#374151">thesis</text>
  <rect x="686" y="384" width="94" height="26" rx="13" fill="#ffffff" stroke="#e2e4e8" stroke-width="1"/><text x="733" y="402" text-anchor="middle" font-size="12" fill="#374151">moments</text>

  <!-- inner state -->
  <text x="400" y="440" font-size="11" font-weight="700" letter-spacing="1.8" fill="#9ca3af">INNER STATE</text>
  <text x="400" y="460" font-size="12" fill="#6b7280">mood · 28-day cycle · relationship climate</text>
  <text x="400" y="477" font-size="12" fill="#6b7280">compiled to a few directives a turn, never shown</text>

  <!-- consent -->
  <rect x="400" y="496" width="380" height="28" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="1"/>
  <text x="590" y="515" text-anchor="middle" font-size="12" fill="#9a3412">an action that sends, books or deletes waits for your yes</text>

  <!-- ─────────── column C · hermes ─────────── -->
  <text x="880" y="122" font-size="12" font-weight="700" letter-spacing="2.2" fill="#b45309">HERMES-AGENT · THE ENGINE</text>
  <text x="880" y="140" font-size="12.5" fill="#6b7280">unmodified. Irises never edits its files.</text>

  <rect x="880" y="154" width="280" height="392" rx="20" fill="#f7f7f9" stroke="#e5e7eb" stroke-width="1.2"/>

  <rect x="900" y="174" width="240" height="46" rx="12" fill="#ffffff" stroke="#e2e4e8" stroke-width="1"/>
  <text x="916" y="194" font-size="15" font-weight="700" fill="#111827">research</text>
  <text x="916" y="211" font-size="12" fill="#6b7280">web · many sources</text>

  <rect x="900" y="228" width="240" height="46" rx="12" fill="#ffffff" stroke="#e2e4e8" stroke-width="1"/>
  <text x="916" y="248" font-size="15" font-weight="700" fill="#111827">files</text>
  <text x="916" y="265" font-size="12" fill="#6b7280">read · parse · run code</text>

  <rect x="900" y="282" width="240" height="46" rx="12" fill="#ffffff" stroke="#e2e4e8" stroke-width="1"/>
  <text x="916" y="302" font-size="15" font-weight="700" fill="#111827">mail</text>
  <text x="916" y="319" font-size="12" fill="#6b7280">inbox · read-only</text>

  <rect x="900" y="336" width="240" height="46" rx="12" fill="#ffffff" stroke="#e2e4e8" stroke-width="1"/>
  <text x="916" y="356" font-size="15" font-weight="700" fill="#111827">cron</text>
  <text x="916" y="373" font-size="12" fill="#6b7280">reminders · watches</text>

  <rect x="900" y="390" width="240" height="46" rx="12" fill="#ffffff" stroke="#e2e4e8" stroke-width="1"/>
  <text x="916" y="410" font-size="15" font-weight="700" fill="#111827">memory</text>
  <text x="916" y="427" font-size="12" fill="#6b7280">its own · per chat</text>

  <rect x="900" y="452" width="240" height="28" rx="14" fill="#fff7ed" stroke="#b45309" stroke-width="1"/>
  <text x="1020" y="471" text-anchor="middle" font-size="12" fill="#9a3412">engine mode · reply contract only</text>

  <text x="1020" y="516" text-anchor="middle" font-size="12" fill="#6b7280">an OpenClaw adapter exists, untested</text>

  <!-- ─────────── arrows A ↔ B, aligned to the bubbles ─────────── -->
  <line x1="284" y1="278" x2="376" y2="278" stroke="#6b7280" stroke-width="1.8" marker-end="url(#aYou)"/>
  <circle cx="330" cy="278" r="11" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="330" y="282" text-anchor="middle" font-size="12" font-weight="700" fill="#374151">1</text>

  <line x1="376" y1="343" x2="284" y2="343" stroke="#6d5bd0" stroke-width="1.8" marker-end="url(#aIris)"/>
  <circle cx="330" cy="343" r="11" fill="#ffffff" stroke="#6d5bd0" stroke-width="1.5"/>
  <text x="330" y="347" text-anchor="middle" font-size="12" font-weight="700" fill="#6d5bd0">2</text>

  <line x1="376" y1="394" x2="284" y2="394" stroke="#6d5bd0" stroke-width="1.8" marker-end="url(#aIris)"/>
  <circle cx="330" cy="394" r="11" fill="#ffffff" stroke="#6d5bd0" stroke-width="1.5"/>
  <text x="330" y="398" text-anchor="middle" font-size="12" font-weight="700" fill="#6d5bd0">5</text>

  <!-- ─────────── arrows B ↔ C ─────────── -->
  <line x1="802" y1="214" x2="876" y2="214" stroke="#6d5bd0" stroke-width="1.8" marker-end="url(#aIris)"/>
  <circle cx="839" cy="214" r="11" fill="#ffffff" stroke="#6d5bd0" stroke-width="1.5"/>
  <text x="839" y="218" text-anchor="middle" font-size="12" font-weight="700" fill="#6d5bd0">3</text>

  <line x1="876" y1="278" x2="802" y2="278" stroke="#b45309" stroke-width="1.8" marker-end="url(#aHerm)"/>
  <circle cx="839" cy="278" r="11" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
  <text x="839" y="282" text-anchor="middle" font-size="12" font-weight="700" fill="#b45309">4</text>

  <line x1="876" y1="394" x2="802" y2="394" stroke="#b45309" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#aHerm)"/>
  <circle cx="839" cy="394" r="11" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
  <text x="839" y="398" text-anchor="middle" font-size="12" font-weight="700" fill="#b45309">6</text>

  <!-- ─────────── legend ─────────── -->
  <line x1="40" y1="590" x2="1160" y2="590" stroke="#e5e7eb" stroke-width="1"/>

  <text x="40" y="616" font-size="13" fill="#374151"><tspan font-weight="700" fill="#374151">1</tspan>  your message, on any channel</text>
  <text x="420" y="616" font-size="13" fill="#374151"><tspan font-weight="700" fill="#6d5bd0">2</tspan>  a holding text, at once</text>
  <text x="800" y="616" font-size="13" fill="#374151"><tspan font-weight="700" fill="#6d5bd0">3</tspan>  the meta-prompt, a brief for hermes</text>
  <text x="40" y="640" font-size="13" fill="#374151"><tspan font-weight="700" fill="#b45309">4</tspan>  ANSWER · SOURCE · ACTIONS · FLAGS</text>
  <text x="420" y="640" font-size="13" fill="#374151"><tspan font-weight="700" fill="#6d5bd0">5</tspan>  the result, in her voice</text>
  <text x="800" y="640" font-size="13" fill="#374151"><tspan font-weight="700" fill="#b45309">6</tspan>  cron and mail push back through her</text>
</svg>
