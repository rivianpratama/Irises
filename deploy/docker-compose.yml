# Runs Irises on a single VM behind Caddy (which gives it automatic HTTPS).
# - `app`   : your container, pulled from any registry (or docker-loaded onto the box). Internal only.
# - `caddy` : public entry point on 80/443; terminates TLS and proxies to the app.
# Values are read from /opt/irises/.env on the VM (see env.vm.example). Never commit that .env.
# Memory limits keep a leak in one container from taking down a small 1 GB VM.

services:
  app:
    image: ${IMAGE}                 # set in .env, e.g. ghcr.io/<you>/irises:latest
    restart: unless-stopped
    env_file:
      - .env        # VM-only: secrets + this-deployment values (IMAGE / URLs / keys)
      - app.env     # committed, IDE-editable config shipped by each deploy (wins on overlap)
    expose:
      - "8080"                      # reachable only by caddy on the internal network
    volumes:
      - irises_state:/data          # IRISES_HOME: SQLite + memory-tier markdown survive redeploys
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    env_file: .env                  # Caddyfile reads {$SITE_ADDRESS} from here
    ports:
      - "80:80"
      - "443:443"
    mem_limit: 128m
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data            # persists Let's Encrypt certs across restarts
      - caddy_config:/config

volumes:
  irises_state:
  caddy_data:
  caddy_config:
